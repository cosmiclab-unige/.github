<!doctype html>
<!-- Org profile banner. Render with assets-src/build.sh (light and dark variants). -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --ink: #1f2328; --muted: #59636e;
    --red: #e31e24; --blue: #009fe3; --line: #d1d9e0;
  }
  .dark {
    --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --line: #3d444d;
  }
  html, body { margin: 0; width: 1280px; height: 360px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif; color: var(--ink);
    background: var(--bg);
    display: flex; align-items: center; gap: 56px; padding: 0 64px; box-sizing: border-box;
    position: relative;
  }
  .logo {
    flex: none; width: 300px; height: 262px; border-radius: 22px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px var(--line);
  }
  .logo img { width: 268px; }
  .text { flex: 1; }
  .kicker { font-size: 17px; font-weight: 600; letter-spacing: 2.4px; color: var(--blue); text-transform: uppercase; }
  h1 { margin: 12px 0 14px; font-family: "Inter Display", "Inter", sans-serif; font-size: 50px; line-height: 1.08; font-weight: 700; letter-spacing: -0.8px; }
  h1 span { color: var(--red); }
  .sub { font-size: 21px; line-height: 1.45; color: var(--muted); max-width: 760px; }
  .chips { margin-top: 22px; display: flex; gap: 10px; }
  .chip { font-size: 15px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink); }
  .arc { position: absolute; right: -120px; top: -260px; width: 620px; height: 620px; border-radius: 50%;
         border: 26px solid var(--red); opacity: 0.07; }
</style>
</head>
<body>
  <div class="arc"></div>
  <div class="logo"><img src="cosmic-logo.png" alt=""></div>
  <div class="text">
    <div class="kicker">DITEN &middot; University of Genoa</div>
    <h1>Flexible, distributed<br><span>tactile sensing</span></h1>
    <div class="sub">for wearables, prosthetics and robotics: from piezoelectric sensors to embedded electronics and machine learning.</div>
    <div class="chips">
      <div class="chip">P(VDF-TrFE) e-skin</div>
      <div class="chip">Embedded electronics</div>
      <div class="chip">Edge ML</div>
      <div class="chip">Sensory feedback</div>
    </div>
  </div>
  <script>if (location.search.includes('dark')) document.documentElement.className = 'dark';</script>
</body>
</html>
